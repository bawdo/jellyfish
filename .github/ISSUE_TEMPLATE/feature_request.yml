name: Feature request
description: Suggest a feature or support for another Iru endpoint.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The problem you are trying to solve, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested approach
      description: How you think it could work, including any Iru API endpoint it would need.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked README.md and the `--help` output and this is not already supported.
          required: true
