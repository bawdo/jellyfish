name: Release

# Runs on every push to main. The CI jobs run first (reused from ci.yml).
# A release is then cut only when the newest "## [X.Y.Z] - date" heading in
# CHANGELOG.md names a version with no published release. If vX.Y.Z is not
# tagged, the pushed commit is tagged and built. If the tag already exists
# (made by hand), its commit is built instead and a stale draft of the same
# name is replaced. The darwin binaries are attached with a checksums file,
# and the archives listed in it are attested with build provenance so
# anyone can run: gh attestation verify <archive> --repo bawdo/jellyfish
# The attestation's Sigstore bundle is attached too, for offline checks
# with --bundle.
#
# Only the publish job can write to the repository, and it has no checkout
# and runs no project code. The build job compiles with a read-only token
# and without the Go cache, so neither a token nor a poisoned cache entry is
# in reach of the code that ends up in the release.

permissions:
  contents: read

on:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  plan:
    name: Plan
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.plan.outputs.due }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether a release is due
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(./scripts/changelog-version.sh version)
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Build from the tag's commit when the tag was made by hand,
          # otherwise from the pushed commit, which the release will tag.
          if git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            commit=$(git rev-parse "refs/tags/$tag^{commit}")
            echo "$tag exists at $commit"
          else
            commit=$GITHUB_SHA
            echo "$tag is not tagged; it will be created at $commit"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

          # A published release ends it. Drafts are invisible to this
          # read-only token; the publish job deals with them.
          if gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "$tag already has a published release; nothing to release"
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag has no published release; releasing"
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        # From main, where the changelog script and section both exist, even
        # when the release builds an older hand-made tag.
        if: steps.plan.outputs.due == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          # The highest tag below this version, whether or not this version is
          # tagged yet. Sorted on the numbers, so v1.x orders after v0.x.
          previous=$( { git tag -l 'v[0-9]*' | sed 's/^v//'; echo "$VERSION"; } \
            | sort -u -t. -k1,1n -k2,2n -k3,3n \
            | grep -B1 -x "$VERSION" | sed -n '1p' | grep -v -x "$VERSION" \
            | sed 's/^/v/' || true)
          {
            ./scripts/changelog-version.sh notes "$VERSION"
            echo
            echo "Verify a downloaded archive with:"
            echo
            echo '```'
            echo "gh attestation verify jellyfish_${VERSION}_darwin_<arch>.tar.gz --repo $GITHUB_REPOSITORY"
            echo "# or from the attached Sigstore bundle, without the attestation API:"
            echo "gh attestation verify jellyfish_${VERSION}_darwin_<arch>.tar.gz --repo $GITHUB_REPOSITORY \\"
            echo "  --bundle jellyfish_${VERSION}_provenance.sigstore.json"
            echo "shasum -a 256 -c checksums.txt --ignore-missing"
            echo '```'
            if [ -n "$previous" ]; then
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...v$VERSION"
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Keep the release notes for the publish job
        if: steps.plan.outputs.due == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.due == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the commit to release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false

      - name: Build darwin binaries
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          ldflags="-s -w \
            -X github.com/bawdo/jellyfish/internal/version.Version=$tag \
            -X github.com/bawdo/jellyfish/internal/version.Commit=$COMMIT \
            -X github.com/bawdo/jellyfish/internal/version.Tag=$tag \
            -X github.com/bawdo/jellyfish/internal/version.Dirty=false"
          mkdir -p dist
          for arch in arm64 amd64; do
            out="dist/jellyfish_${VERSION}_darwin_${arch}"
            mkdir -p "$out"
            CGO_ENABLED=1 GOOS=darwin GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "$out/jellyfish" .
            cp LICENSE README.md CHANGELOG.md "$out/"
            tar -C dist -czf "$out.tar.gz" "$(basename "$out")"
            rm -r "$out"
          done
          (cd dist && shasum -a 256 *.tar.gz > checksums.txt && cat checksums.txt)

      - name: Smoke test the native binary
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          arch=$(uname -m | sed 's/x86_64/amd64/')
          tar -C "$RUNNER_TEMP" -xzf "dist/jellyfish_${VERSION}_darwin_${arch}.tar.gz"
          output=$("$RUNNER_TEMP/jellyfish_${VERSION}_darwin_${arch}/jellyfish" version)
          echo "$output"
          echo "$output" | head -1 | grep -q "^jellyfish v$VERSION" \
            || { echo "built binary does not report v$VERSION"; exit 1; }

      - name: Keep the archives for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Fetch the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Fetch the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: Check the archives match their checksums
        run: cd dist && sha256sum -c checksums.txt

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # The attestation as a Sigstore bundle (one JSON document), named
          # so gh attestation verify --bundle reads it as JSON and Scorecard
          # counts it as a signed release asset.
          bundle="dist/jellyfish_${VERSION}_provenance.sigstore.json"
          cp "$BUNDLE_PATH" "$bundle"
          # A draft is stale (it has no attested assets) and is replaced. A
          # published release that appeared since the plan job is left alone.
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          case "$draft" in
            false) echo "$tag was published since planning; leaving it"; exit 0 ;;
            true)  echo "$tag has a draft release; replacing it"; gh release delete "$tag" --yes ;;
          esac
          # Created as a draft, assets uploaded, then published, so an
          # immutable release never exists without its assets. --target is
          # ignored when the tag already exists.
          gh release create "$tag" \
            --draft \
            --target "$COMMIT" \
            --title "$tag" \
            --notes-file notes/notes.md \
            dist/*.tar.gz dist/checksums.txt "$bundle"
          gh release edit "$tag" --draft=false --latest
          gh release view "$tag" --json url --jq .url
