name: CI

permissions:
  contents: read

# Pull requests run this workflow directly. Pushes to main run it through
# release.yml (workflow_call) so a release is only cut once every job here
# has passed on the merge commit. There is no push trigger for other
# branches: with a pull request open it would run every job a second time
# on the same commit. A branch with no pull request can be run by hand
# (workflow_dispatch) or checked locally with make pre-ci.
on:
  pull_request:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  workflow_dispatch:

# A literal prefix, not github.workflow: when this file runs as a reusable
# workflow that context names the caller, which would put caller and callee
# in the same group and deadlock the run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests (race detector)
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Check formatting (gofmt -s)
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need 'gofmt -s -w':"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.9.0
          args: --timeout=5m

  coverage:
    name: Coverage
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: |
          COVERPKG=$(go list ./... | grep -v testutil | tr '\n' ',' | sed 's/,$//')
          go test -race -coverprofile=coverage.txt -covermode=atomic -coverpkg="$COVERPKG" ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          fail_ci_if_error: false
          verbose: true

  changelog:
    name: Changelog
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the newest CHANGELOG.md version is releasable
        run: ./scripts/changelog-version.sh check

  vuln:
    name: Vulnerability Scan
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  build:
    name: Build & Smoke
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Build jellyfish binary
        run: |
          VERSION=$(git describe --tags --always --dirty)
          COMMIT=$(git rev-parse HEAD)
          TAG=$(git describe --exact-match --tags HEAD 2>/dev/null || echo "")
          if [ -n "$(git status --porcelain)" ]; then DIRTY=true; else DIRTY=false; fi
          LDFLAGS="-X github.com/bawdo/jellyfish/internal/version.Version=$VERSION \
          -X github.com/bawdo/jellyfish/internal/version.Commit=$COMMIT \
          -X github.com/bawdo/jellyfish/internal/version.Tag=$TAG \
          -X github.com/bawdo/jellyfish/internal/version.Dirty=$DIRTY"
          go build -ldflags "$LDFLAGS" -o bin/jellyfish .

      - name: CLI smoke test (jellyfish version)
        run: |
          output=$(./bin/jellyfish version)
          echo "$output"
          if ! echo "$output" | head -1 | grep -q '^jellyfish '; then
            echo "Smoke test failed: 'jellyfish version' did not print build identity"
            exit 1
          fi

  # One stable check name for the main ruleset to require, so adding or
  # renaming a job above does not mean editing the ruleset as well.
  ci-result:
    name: CI result
    if: always()
    needs: [test, lint, coverage, changelog, vuln, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
