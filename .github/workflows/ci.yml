name: CI

permissions:
  contents: read

# Pull requests run this workflow directly. Pushes to main run it through
# release.yml (workflow_call, where github.event_name is push) so a release
# is only cut once every job here except fuzz has passed on the merge
# commit. Fuzz is left off that path so a crash it finds by chance cannot
# hold up an unrelated release; its seed corpus still runs in the coverage
# job, which is the test of record (go test -race over every package).
# There is no push trigger for other branches: with a pull request open it
# would run every job a second time on the same commit. A branch with no
# pull request can be run by hand (workflow_dispatch, every job including
# fuzz) or checked locally with make pre-ci. The weekly schedule runs on
# main and runs only the long fuzz job and govulncheck; it runs only this
# workflow, so it never reaches release.yml.
on:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  workflow_dispatch:

# A literal prefix, not github.workflow: when this file runs as a reusable
# workflow that context names the caller, which would put caller and callee
# in the same group and deadlock the run. A scheduled run gets a group of
# its own so its long fuzz run never holds up the CI of a push to main.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'schedule-' || '' }}${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Check formatting (gofmt -s)
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need 'gofmt -s -w':"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.9.0
          args: --timeout=5m

  # The test of record: one race-enabled run over every package, with
  # -coverpkg so the profile counts cross-package coverage for Codecov.
  coverage:
    name: Test & Coverage
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: |
          COVERPKG=$(go list ./... | grep -v testutil | tr '\n' ',' | sed 's/,$//')
          go test -race -coverprofile=coverage.txt -covermode=atomic -coverpkg="$COVERPKG" ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          fail_ci_if_error: false
          verbose: true

  changelog:
    name: Changelog
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the newest CHANGELOG.md version is releasable
        run: ./scripts/changelog-version.sh check

  vuln:
    name: Vulnerability Scan
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  build:
    name: Build & Smoke
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Build jellyfish binary
        run: |
          VERSION=$(git describe --tags --always --dirty)
          COMMIT=$(git rev-parse HEAD)
          TAG=$(git describe --exact-match --tags HEAD 2>/dev/null || echo "")
          if [ -n "$(git status --porcelain)" ]; then DIRTY=true; else DIRTY=false; fi
          LDFLAGS="-X github.com/bawdo/jellyfish/internal/version.Version=$VERSION \
          -X github.com/bawdo/jellyfish/internal/version.Commit=$COMMIT \
          -X github.com/bawdo/jellyfish/internal/version.Tag=$TAG \
          -X github.com/bawdo/jellyfish/internal/version.Dirty=$DIRTY"
          go build -ldflags "$LDFLAGS" -o bin/jellyfish .

      - name: CLI smoke test (jellyfish version)
        run: |
          output=$(./bin/jellyfish version)
          echo "$output"
          if ! echo "$output" | head -1 | grep -q '^jellyfish '; then
            echo "Smoke test failed: 'jellyfish version' did not print build identity"
            exit 1
          fi

  # Short fuzz runs on pull requests and manual runs, a longer one on the
  # weekly schedule. Skipped on pushes to main (the release path) so fuzzing
  # never gates a release. The fuzzed packages do not touch the Keychain or
  # need cgo, so this runs on Linux. A failing input is kept as an artifact
  # so it can be reproduced locally.
  fuzz:
    name: Fuzz
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 60 || 15 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run fuzz targets
        env:
          FUZZTIME: ${{ github.event_name == 'schedule' && '5m' || '15s' }}
        run: make fuzz FUZZTIME="$FUZZTIME"

      - name: Keep failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: internal/*/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14

  # One stable check name for the main ruleset to require, so adding or
  # renaming a job above does not mean editing the ruleset as well.
  #
  # Every job in needs is expected to succeed, except the ones a trigger
  # skips on purpose:
  #   pull_request, workflow_dispatch: none (all six jobs run)
  #   push (release.yml via workflow_call): fuzz
  #   schedule: lint, coverage, changelog and build (fuzz and vuln run)
  # Any other event expects every job. A failed or cancelled job always
  # fails the gate, and so does a skip that the event does not allow, so a
  # job left out by a bad if: condition cannot pass unnoticed. A job added
  # to needs is expected under every trigger unless it is listed as a
  # permitted skip in the script below.
  ci-result:
    name: CI result
    if: always()
    needs: [lint, coverage, changelog, vuln, build, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every expected job passed
        env:
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push)     may_skip='["fuzz"]' ;;
            schedule) may_skip='["lint","coverage","changelog","build"]' ;;
            *)        may_skip='[]' ;;
          esac
          # Mirrors needs above, so a job missing from the results fails too.
          all='["lint","coverage","changelog","vuln","build","fuzz"]'
          echo "Event: $EVENT (may skip: $may_skip)"
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<<"$NEEDS"
          bad=$(jq -r --argjson all "$all" --argjson skip "$may_skip" '
            if type != "object" then "job results are not an object"
            else . as $needs | ($all + keys | unique)[]
              | . as $job | ($needs[$job].result // "missing") as $r
              | if $r == "success" then empty
                elif $r == "skipped" and ($skip | any(. == $job)) then empty
                else "\($job): \($r)" end
            end' <<<"$NEEDS")
          if [ -n "$bad" ]; then
            echo "Not passed:"
            echo "$bad" | sed 's/^/  /'
            exit 1
          fi
          echo "Every expected job passed."
