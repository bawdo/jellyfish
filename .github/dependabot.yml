version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Sydney
    # Wait a week before taking a new release, so one that is found to be
    # compromised or broken soon after publishing never lands here. Security
    # updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ["*"]
    commit-message:
      prefix: "Bumped"
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Sydney
    # Wait a week before taking a new release, so one that is found to be
    # compromised or broken soon after publishing never lands here. Security
    # updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Bumped"
    labels: [dependencies]
