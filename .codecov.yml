coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      # Floor: project coverage must stay at or above 90%.
      default:
        target: 90%
        threshold: 1%
        informational: false
        if_ci_failed: error
      # Ratchet: a change may not drop coverage more than 1% below its base,
      # even while still above the floor.
      no-regression:
        target: auto
        threshold: 1%
        informational: false
        if_ci_failed: error

    patch:
      default:
        target: 80%
        threshold: 0.5%
        informational: true
        if_ci_failed: error

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

ignore:
  - "**/*_test.go"
  - "**/testdata"

github_checks:
  annotations: true
